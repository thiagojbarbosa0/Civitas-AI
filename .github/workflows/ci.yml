name: CI - Civitas AI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: python -m ruff check app tests
      - name: Test suite and coverage
        run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=85
      - name: Validate fine-tuning sample dataset (without downloading weights)
        run: python training/finetune_lora.py --dry-run
      - name: HTTP smoke + release audit
        run: |
          python -m scripts.smoke_http
          python scripts/audit_release.py
      - name: Static Python syntax
        run: python -m compileall -q app tests training
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image (demo mode)
        run: docker build --build-arg WITH_LLM=false -t civitas-ai:ci .
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP app and Playwright
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Browser DOM smoke using local ASGI bridge
        run: python -m scripts.smoke_browser_bridge
      - name: Browser UI smoke over HTTP
        run: python -m scripts.smoke_browser
